[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "universal-llm-toolkit"
version = "0.1.0"
description = "A provider-independent, policy-governed tool execution framework for LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "License to be selected" }
authors = [{ name = "ULTK contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jsonschema>=4.22", "psutil>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
computer = ["pyautogui>=0.9.54", "pyperclip>=1.9", "PyWinCtl>=0.4.01"]
computer-visual = ["pyautogui>=0.9.54", "Pillow>=10.0", "pytesseract>=0.3.13"]
computer-os = [
  "PyWinCtl>=0.4.01",
  "pyautogui>=0.9.54",
  "screeninfo>=0.8.1",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "pyvda>=0.4; platform_system == 'Windows'",
  "pyudev>=0.24; platform_system == 'Linux'",
]
browser = ["playwright>=1.48"]
devtools = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/ultk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
